name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      sections:
        description: "Comma-separated section list (optional)"
        required: false
        default: ""
  pull_request:
    paths:
      - "docs/qa/**"
      - "docs/commands/**"
      - "tests/e2e/**"
      - "tests/conformance/**"
      - "tools/sqlite_state_assert.py"
      - "tests/integration/test_sqlite_state_assert_runtime_cli.py"
      - ".github/workflows/e2e-tests.yml"

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest

      - name: Run sqlite_state_assert tests
        run: |
          python -m pytest \
            tests/unit/test_sqlite_state_assert_matchers.py \
            tests/unit/test_sqlite_state_assert_compare.py \
            tests/unit/test_sqlite_state_assert_json_validation.py \
            tests/integration/test_sqlite_state_assert_cli.py \
            tests/integration/test_sqlite_state_assert_runtime_cli.py

      - name: Run QA sections
        env:
          QA_SECTIONS: ${{ github.event.inputs.sections }}
        run: bash tests/e2e/scripts/run_all_sections.sh

      - name: Print compact summary
        if: always()
        run: |
          if [[ -f tests/e2e/failures/summary.txt ]]; then
            cat tests/e2e/failures/summary.txt
          else
            echo "No summary produced."
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-failures
          path: |
            tests/e2e/failures/
            qa_failures/
